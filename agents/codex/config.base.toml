# Seed for ~/.codex/config.toml — copied only when that file doesn't exist.
# Codex rewrites its config (trusted projects, plugins, hook hashes), so it is
# not symlinked; installAi.sh also enforces the telemetry tables below on
# existing configs.
model_reasoning_effort = "medium"
# no "Update available" dialog on start: it blocks agents started by herdr/squad.
# Homebrew updates Codex instead.
check_for_update_on_startup = false

[features]
hooks = true

[analytics]
enabled = false

[feedback]
enabled = false

# Claude-only plugin: its Stop hook (asyncRewake, CLAUDE_PLUGIN_ROOT) fails in
# Codex after every turn. It stays enabled in Claude Code.
[plugins."security-guidance@claude-plugins-official"]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
